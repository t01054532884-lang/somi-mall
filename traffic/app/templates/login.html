{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="card login">
  <h1>소미몰 <span style="color: var(--accent)">트래픽</span></h1>
  <p class="sub">운영자 전용 대시보드입니다.</p>
  {% if configured %}
  <form method="post" action="/login">
    <label>관리자 비밀번호
      <input type="password" name="password" required autofocus autocomplete="current-password">
    </label>
    <button class="primary">로그인</button>
  </form>
  {% else %}
  <p class="flash error">서버 환경 변수 <code>ADMIN_PASSWORD</code>를 설정한 뒤 다시 시작해 주세요.</p>
  {% endif %}
</div>
{% endblock %}
