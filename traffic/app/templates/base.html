<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}운영 대시보드{% endblock %} · 소미몰 트래픽</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if path != "/login" %}
  <header class="topbar">
    <a class="brand" href="/">소미몰 <span>트래픽</span></a>
    <nav class="nav">
      <a href="/" class="{{ 'on' if path == '/' }}">대시보드</a>
      <a href="/inventory" class="{{ 'on' if path.startswith('/inventory') }}">재고·발주</a>
      <a href="/suppliers" class="{{ 'on' if path.startswith('/suppliers') }}">도매가 추적</a>
      <a href="/data" class="{{ 'on' if path.startswith('/data') }}">데이터 연동</a>
      <a href="/settings" class="{{ 'on' if path.startswith('/settings') }}">설정</a>
    </nav>
    <form method="post" action="/logout" class="inline"><button class="link">로그아웃</button></form>
  </header>
  {% endif %}
  <main>
    {% if message %}<div class="flash {{ message[0] }}">{{ message[1] }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
